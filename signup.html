<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Toran DNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0A0F1A;
  --navy-2: #111827;
  --navy-3: #1C2B4A;
  --blue: #4F8EF7;
  --blue-dim: #2563EB;
  --blue-pale: #EFF4FF;
  --blue-pale-2: #DBEAFE;
  --green: #3DD68C;
  --green-pale: #ECFDF5;
  --white: #FFFFFF;
  --text-primary: #0A0F1A;
  --text-secondary: #374151;
  --text-muted: #6B7280;
  --border: #E5E9F0;
  --border-strong: #CBD5E1;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-md: 0 12px 32px rgba(10,15,26,0.08), 0 4px 12px rgba(10,15,26,0.03);
  --font-display: 'DM Sans', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

body {
  font-family: var(--font-body);
  background: radial-gradient(circle at 10% 20%, rgba(239, 244, 255, 0.9) 0%, rgba(248, 249, 252, 1) 90%);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.signup-container {
  width: 100%;
  max-width: 440px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 40px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  position: relative;
  overflow: hidden;
}

.logo-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
}

.logo-mark {
  width: 40px;
  height: 40px;
  background: var(--navy);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.3px;
}

.header-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.5px;
  margin-top: 8px;
}

.header-subtitle {
  font-size: 14px;
  color: var(--text-muted);
}

.social-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-social {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.btn-social:hover {
  background: rgba(10,15,26,0.02);
  border-color: var(--border-strong);
}

.divider {
  display: flex;
  align-items: center;
  text-align: center;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
}

.divider::before, .divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid var(--border);
}

.divider:not(:empty)::before { margin-right: 12px; }
.divider:not(:empty)::after { margin-left: 12px; }

form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}

.input-field {
  width: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text-primary);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  transition: border-color 0.15s, box-shadow 0.15s;
  outline: none;
}

.input-field:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-pale);
}

.form-actions {
  display: flex;
  align-items: center;
  font-size: 13px;
}

.checkbox-wrap {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  cursor: pointer;
}

.checkbox-wrap input {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  margin-top: 2px;
}

.btn-submit {
  width: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--white);
  background: var(--navy);
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-submit:hover {
  background: #1a2540;
}

.footer-note {
  text-align: center;
  font-size: 13.5px;
  color: var(--text-muted);
}

.footer-note a {
  color: var(--blue-dim);
  text-decoration: none;
  font-weight: 500;
}

.footer-note a:hover {
  text-decoration: underline;
}

/* Spinner */
.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: var(--white);
  animation: spin 0.8s linear infinite;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.alert {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  display: none;
}

.alert-success {
  background: var(--green-pale);
  color: #065F46;
  border: 1px solid #A7F3D0;
}
.alert-error {
  background: #FEF2F2;
  color: #991B1B;
  border: 1px solid #FECACA;
}
</style>
</head>
<body>

<div class="signup-container">
  <div class="logo-header">
    <div class="logo-mark">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 2L2 5.5v5C2 13.75 5.08 16.7 9 18c3.92-1.3 7-4.25 7-7.5v-5L9 2z" fill="#4F8EF7" opacity="0.3"/>
        <path d="M9 2L2 5.5v5C2 13.75 5.08 16.7 9 18c3.92-1.3 7-4.25 7-7.5v-5L9 2z" fill="none" stroke="#4F8EF7" stroke-width="1.5"/>
        <circle cx="9" cy="9.5" r="2.5" fill="#4F8EF7"/>
      </svg>
    </div>
    <span class="logo-text">Toran DNS</span>
    <h1 class="header-title">Create your account</h1>
    <p class="header-subtitle">Get started with private, fast DNS filtering</p>
  </div>

  <div class="social-buttons">
    <button class="btn-social" id="btn-google-signup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      Google
    </button>
    <button class="btn-social" id="btn-github-signup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.11.82-.26.82-.577v-2.234c-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22v3.293c0 .319.22.694.825.576C20.565 21.795 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      GitHub
    </button>
  </div>

  <div class="divider">or sign up with email</div>

  <div id="alert-msg" class="alert alert-success">Account created! Redirecting to setup...</div>

  <form id="signup-form" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label class="form-label" for="fullname">Full name</label>
      <input class="input-field" type="text" id="fullname" required placeholder="Siddhant Sah" autocomplete="name">
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="input-field" type="email" id="email" required placeholder="name@domain.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="input-field" type="password" id="password" required placeholder="Min. 8 characters" minlength="8" autocomplete="new-password">
    </div>

    <div class="form-actions">
      <label class="checkbox-wrap">
        <input type="checkbox" required>
        <span>I agree to the <a href="#" class="link-forgot">Terms of Service</a> and <a href="#" class="link-forgot">Privacy Policy</a></span>
      </label>
    </div>

    <button class="btn-submit" type="submit">
      <span class="spinner" id="btn-spinner"></span>
      <span id="btn-text">Create account</span>
    </button>
  </form>

  <p class="footer-note">
    Already have an account? <a href="login.html">Log in</a>
  </p>
</div>

<script type="module">
import authService from './auth.js';

window.handleSignup = async function(e) {
  e.preventDefault();
  const spinner = document.getElementById('btn-spinner');
  const text = document.getElementById('btn-text');
  const alertMsg = document.getElementById('alert-msg');
  const name = document.getElementById('fullname').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  alertMsg.style.display = 'none';
  spinner.style.display = 'block';
  text.textContent = 'Creating account...';

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    spinner.style.display = 'none';
    text.textContent = 'Create account';
    alertMsg.className = 'alert alert-error';
    alertMsg.textContent = 'Please enter a valid email address';
    alertMsg.style.display = 'block';
    return;
  }

  if (password.length < 8) {
    spinner.style.display = 'none';
    text.textContent = 'Create account';
    alertMsg.className = 'alert alert-error';
    alertMsg.textContent = 'Password must be at least 8 characters';
    alertMsg.style.display = 'block';
    return;
  }

  try {
    await authService.signup({ name, email, password });
    alertMsg.className = 'alert alert-success';
    alertMsg.textContent = 'Account created! A verification email has been sent to ' + email + '. Please verify your email before logging in.';
    alertMsg.style.display = 'block';
    text.textContent = 'Done!';
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 4000);
  } catch (err) {
    spinner.style.display = 'none';
    text.textContent = 'Create account';
    alertMsg.className = 'alert alert-error';
    const msg = err.code === 'auth/email-already-in-use'
      ? 'An account with this email already exists'
      : err.code === 'auth/invalid-email'
      ? 'Please enter a valid email address'
      : err.code === 'auth/weak-password'
      ? 'Password must be at least 6 characters'
      : err.message || 'Registration failed';
    alertMsg.textContent = msg;
    alertMsg.style.display = 'block';
  }
};

document.getElementById('btn-google-signup')?.addEventListener('click', async () => {
  const alertMsg = document.getElementById('alert-msg');
  alertMsg.style.display = 'none';
  try {
    await authService.loginWithGoogle();
    alertMsg.className = 'alert alert-success';
    alertMsg.textContent = 'Signed up with Google! Redirecting...';
    alertMsg.style.display = 'block';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
  } catch (err) {
    alertMsg.className = 'alert alert-error';
    alertMsg.textContent = err.message || 'Google sign-up failed';
    alertMsg.style.display = 'block';
  }
});

document.getElementById('btn-github-signup')?.addEventListener('click', async () => {
  const alertMsg = document.getElementById('alert-msg');
  alertMsg.style.display = 'none';
  try {
    await authService.loginWithGitHub();
    alertMsg.className = 'alert alert-success';
    alertMsg.textContent = 'Signed up with GitHub! Redirecting...';
    alertMsg.style.display = 'block';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
  } catch (err) {
    alertMsg.className = 'alert alert-error';
    alertMsg.textContent = err.message || 'GitHub sign-up failed';
    alertMsg.style.display = 'block';
  }
});
</script>
</body>
</html>
