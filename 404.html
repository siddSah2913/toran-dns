<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Toran DNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="background.css">
<style>
  body {
    font-family: var(--font-body);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .error-card {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.28);
    max-width: 440px;
    margin: 0 auto;
    padding: 48px 40px;
    border-radius: 28px;
    box-shadow: 0 8px 32px rgba(31,38,135,0.12), inset 0 1px 0 rgba(255,255,255,0.5);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .error-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0));
    pointer-events: none;
  }

  .error-code {
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 600;
    letter-spacing: -3px;
    background: linear-gradient(135deg, #2563EB 0%, #3B82F6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }

  .error-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    margin: 0 0 16px;
    position: relative;
    z-index: 1;
  }

  .error-desc {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.65;
    margin: 0 0 28px;
    position: relative;
    z-index: 1;
  }

  .error-card a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #2563EB 0%, #3B82F6 100%);
    text-decoration: none;
    color: white;
    padding: 14px 32px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    box-shadow: 0 4px 16px rgba(37,99,235,0.3);
    transition: all 300ms cubic-bezier(0.22, 0.61, 0.36, 1);
    position: relative;
    z-index: 1;
  }

  .error-card a:hover {
    background: linear-gradient(135deg, #1D4ED8 0%, #2563EB 100%);
    box-shadow: 0 6px 20px rgba(37,99,235,0.4);
    transform: translateY(-1px);
  }

  .error-card a:active { transform: translateY(0); }

  @media (max-width: 480px) {
    .error-card { padding: 36px 28px; }
    .error-code { font-size: 56px; }
    .error-title { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- Living Background -->
<div class="bg-base" aria-hidden="true"></div>
<div class="bg-blobs" aria-hidden="true">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <div class="bg-blob bg-blob-4"></div>
</div>
<div class="bg-mesh" aria-hidden="true"></div>
<div class="bg-reflection bg-reflection-1" aria-hidden="true"></div>
<div class="bg-reflection bg-reflection-2" aria-hidden="true"></div>
<div class="bg-noise" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>

<main>
<div class="error-card">
  <div class="error-code">404</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-desc">The page you're looking for doesn't exist or has been moved. Check the URL and try again.</p>
  <a href="index.html">Back to Home</a>
</div>
</main>

</body>
</html>
